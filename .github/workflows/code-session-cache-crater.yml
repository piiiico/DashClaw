name: Code session cache crater

# Scheduler for `/api/cron/code-session-cache-crater`. Weekly cleanup
# of stale code-session derived caches. Without this, the cache table
# grows unbounded and read latency on the sessions surface drifts.
#
# Setup (same secrets as outcome-sweep.yml):
#   1. In repo Settings → Secrets and variables → Actions, ensure:
#        - DASHCLAW_BASE_URL
#        - CRON_SECRET
#   2. Enable this workflow (disabled for forks by default).
#
# Manual trigger: Actions tab → "Code session cache crater" → "Run workflow".

on:
  schedule:
    # Weekly on Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  crater:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/code-session-cache-crater
        env:
          BASE_URL: ${{ secrets.DASHCLAW_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DASHCLAW_BASE_URL or CRON_SECRET not set — skipping."
            exit 0
          fi
          status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/code-session-cache-crater")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
