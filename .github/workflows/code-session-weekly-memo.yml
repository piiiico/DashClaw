name: Code session weekly memo

# Scheduler for `/api/cron/code-session-weekly-memo`. Generates the
# weekly developer memo summarizing the previous week's code-session
# activity. Without this, the memo surface goes silent.
#
# Setup (same secrets as outcome-sweep.yml):
#   1. In repo Settings → Secrets and variables → Actions, ensure:
#        - DASHCLAW_BASE_URL
#        - CRON_SECRET
#   2. Enable this workflow (disabled for forks by default).
#
# Manual trigger: Actions tab → "Code session weekly memo" → "Run workflow".

on:
  schedule:
    # Weekly on Monday at 04:00 UTC (one hour after cache-crater so the
    # memo reads from a freshly-pruned cache).
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  memo:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/code-session-weekly-memo
        env:
          BASE_URL: ${{ secrets.DASHCLAW_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DASHCLAW_BASE_URL or CRON_SECRET not set — skipping."
            exit 0
          fi
          status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/code-session-weekly-memo")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
